# Render Blueprint — https://dashboard.render.com/blueprints
# New → Blueprint → select this repo. The persistent disk needs a paid instance (starter+).
# Run exactly ONE instance: the JSON database and the in-process scheduler assume a single server.

services:
  - type: web
    name: deepchq
    runtime: docker
    plan: starter
    region: oregon
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATABASE_URL
        value: file:/app/data/deepchq.json
      - key: NEXT_PUBLIC_SITE_URL
        value: https://deepchq.app
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ENABLE_INTERNAL_CRON
        value: "true"
      - key: CRON_INTERVAL_MINUTES
        value: "30"
      # Live AI engines — add whichever keys you have; missing ones fall back to labelled estimates.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Email (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Billing (Razorpay subscriptions)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_GROWTH_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_GROWTH_ANNUAL
        sync: false
      - key: RAZORPAY_PLAN_AGENCY_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_AGENCY_ANNUAL
        sync: false
    disk:
      name: deepchq-data
      mountPath: /app/data
      sizeGB: 1
