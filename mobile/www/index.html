<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Deepchq</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        color: #0f172a;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #0f172a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div style="text-align: center">
      <div class="spinner" aria-hidden="true"></div>
      <p style="margin: 0; font-size: 14px">Loading Deepchq…</p>
    </div>
    <script>
      // Fallback if server.url is not injected (local www only)
      var target = "https://deepchq.onrender.com";
      setTimeout(function () {
        if (location.pathname.endsWith("index.html") || location.pathname === "/") {
          location.replace(target);
        }
      }, 100);
    </script>
  </body>
</html>
